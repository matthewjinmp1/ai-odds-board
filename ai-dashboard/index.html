<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AI Odds Board</title>
<style>
  :root {
    color-scheme: light;
    --surface-0: #f4f4f2;
    --surface-1: #fcfcfb;
    --border: #e2e1dc;
    --text-primary: #0b0b0b;
    --text-secondary: #52514e;
    --text-muted: #85847f;
    --accent: #2a78d6;
    --accent-track: #e6eef9;
    --up: #008300;
    --down: #d03b3a;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      color-scheme: dark;
      --surface-0: #111110;
      --surface-1: #1a1a19;
      --border: #2e2e2c;
      --text-primary: #ffffff;
      --text-secondary: #c3c2b7;
      --text-muted: #8c8b84;
      --accent: #3987e5;
      --accent-track: #1f2a38;
      --up: #3fb950;
      --down: #e66767;
    }
  }
  :root[data-theme="dark"] {
    color-scheme: dark;
    --surface-0: #111110;
    --surface-1: #1a1a19;
    --border: #2e2e2c;
    --text-primary: #ffffff;
    --text-secondary: #c3c2b7;
    --text-muted: #8c8b84;
    --accent: #3987e5;
    --accent-track: #1f2a38;
    --up: #3fb950;
    --down: #e66767;
  }
  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  body {
    margin: 0; background: var(--surface-0); color: var(--text-primary);
    font: 14px/1.4 -apple-system, BlinkMacSystemFont, "Segoe UI", Inter, sans-serif;
  }
  header {
    position: sticky; top: 0; z-index: 5; background: var(--surface-0);
    border-bottom: 1px solid var(--border); padding: 14px 24px;
    display: flex; flex-wrap: wrap; gap: 12px; align-items: center;
  }
  h1 { font-size: 18px; margin: 0 16px 0 0; }
  .controls { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; flex: 1; }
  input[type=search], select {
    background: var(--surface-1); color: var(--text-primary); border: 1px solid var(--border);
    border-radius: 8px; padding: 7px 10px; font: inherit;
  }
  input[type=search] { min-width: 220px; flex: 0 1 300px; }
  .chip {
    background: var(--surface-1); border: 1px solid var(--border); color: var(--text-secondary);
    border-radius: 999px; padding: 5px 12px; cursor: pointer; font: inherit;
  }
  .chip.on { background: var(--text-primary); color: var(--surface-1); border-color: var(--text-primary); }
  .status { color: var(--text-muted); font-size: 12px; margin-left: auto; }
  main { padding: 20px 24px 60px; max-width: 1500px; margin: 0 auto; }
  h2 { font-size: 15px; margin: 28px 0 12px; color: var(--text-secondary); text-transform: uppercase; letter-spacing: .06em; }
  h2 .count { color: var(--text-muted); font-weight: 400; }
  .tiles { display: grid; grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); gap: 12px; }
  .tile {
    background: var(--surface-1); border: 1px solid var(--border); border-radius: 12px;
    padding: 14px 16px; text-decoration: none; color: inherit; display: block;
  }
  .tile { position: relative; }
  .tile .cover { position: absolute; inset: 0; border-radius: inherit; }
  .tile .label { padding-right: 26px; }
  .tile-head { display: flex; gap: 10px; align-items: flex-start; }
  .tile-head img { width: 32px; height: 32px; border-radius: 7px; object-fit: cover; flex: none; }
  .val-tile .tile-head { align-items: center; }
  .star {
    background: none; border: none; cursor: pointer; padding: 2px; line-height: 1;
    font-size: 18px; color: var(--text-muted); flex: none; margin-left: auto;
  }
  .star:hover { color: var(--text-primary); }
  .star.on { color: #eda100; }
  .tile[draggable="true"] { cursor: grab; }
  .tile.dragging, .card.dragging { opacity: 0.35; }
  .card[draggable="true"] { cursor: grab; }
  h2 .hint { text-transform: none; letter-spacing: 0; font-weight: 400; font-size: 12px; color: var(--text-muted); margin-left: 8px; }
  .tile .star { position: absolute; top: 10px; right: 10px; z-index: 1; }
  .tile:hover, .card:hover { border-color: var(--text-muted); }
  .tile .label { color: var(--text-secondary); font-size: 12px; min-height: 2.8em; }
  .tile .big { font-size: 24px; font-weight: 650; margin-top: 6px; font-variant-numeric: tabular-nums; }
  .tile .sub { color: var(--text-muted); font-size: 12px; }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(340px, 1fr)); gap: 14px; }
  .card {
    background: var(--surface-1); border: 1px solid var(--border); border-radius: 12px;
    padding: 14px 16px; display: flex; flex-direction: column; gap: 10px;
  }
  .card-head { display: flex; gap: 10px; align-items: flex-start; }
  .card-head img { width: 36px; height: 36px; border-radius: 8px; object-fit: cover; flex: none; }
  .card-head a { color: var(--text-primary); text-decoration: none; font-weight: 600; }
  .card-head a:hover { text-decoration: underline; }
  .meta { color: var(--text-muted); font-size: 12px; margin-top: 2px; }
  .headline { font-size: 13px; color: var(--text-secondary); }
  .headline b { color: var(--text-primary); font-size: 16px; }
  .headline .k, .tile .kind { font-size: 11px; text-transform: uppercase; letter-spacing: .05em; color: var(--text-muted); }
  .headline.est { background: var(--accent-track); border-radius: 8px; padding: 8px 10px; }
  .headline.est .k, .tile .kind.est { color: var(--accent); font-weight: 600; }
  .hsub { font-size: 12px; color: var(--text-secondary); margin-top: 2px; }
  .tile .kind { margin-top: 8px; }
  .rows, .rows .hidden:not([hidden]) { display: flex; flex-direction: column; gap: 6px; }
  .row { display: grid; grid-template-columns: minmax(0, 1fr) 120px 46px 48px; gap: 8px; align-items: center; font-size: 13px; }
  .row .name { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; color: var(--text-secondary); }
  .bar { height: 8px; background: var(--accent-track); border-radius: 4px; overflow: hidden; }
  .bar > span { display: block; height: 100%; background: var(--accent); border-radius: 0 4px 4px 0; }
  .pct { text-align: right; font-variant-numeric: tabular-nums; font-weight: 600; }
  .chg { text-align: right; font-variant-numeric: tabular-nums; font-size: 12px; color: var(--text-muted); }
  .chg.up { color: var(--up); } .chg.down { color: var(--down); }
  .more { background: none; border: none; color: var(--accent); cursor: pointer; padding: 0; font: inherit; font-size: 12px; text-align: left; }
  .val-tile .big { margin-top: 2px; }
  .val-tile .co { font-weight: 600; color: var(--text-primary); font-size: 14px; }
  .chgs { font-size: 12px; font-variant-numeric: tabular-nums; display: flex; gap: 10px; margin-top: 2px; }
  .chgs .up { color: var(--up); } .chgs .down { color: var(--down); }
  .spark { display: block; width: 100%; height: 36px; margin: 8px 0 6px; }
  .spark polyline { fill: none; stroke: var(--accent); stroke-width: 2; stroke-linejoin: round; stroke-linecap: round; vector-effect: non-scaling-stroke; }
  .now { display: flex; align-items: center; gap: 10px; font-size: 13px; color: var(--text-secondary); }
  .now b { color: var(--text-primary); }
  .now .spark { width: 110px; height: 24px; margin: 0; margin-left: auto; }
  .away { font-size: 13px; font-weight: 500; color: var(--text-secondary); margin-left: 8px; white-space: nowrap; }
  .tile .big .away { font-size: 14px; }
  .timeline { display: flex; flex-direction: column; gap: 6px; }
  .tl-month { font-size: 12px; font-weight: 600; text-transform: uppercase; letter-spacing: .06em; color: var(--text-muted); margin: 14px 0 2px; }
  .tl-row {
    position: relative; display: grid; grid-template-columns: 210px 32px minmax(0, 1fr) 150px 24px; gap: 14px; align-items: center;
    background: var(--surface-1); border: 1px solid var(--border); border-radius: 10px; padding: 10px 14px;
  }
  .tl-row:hover { border-color: var(--text-muted); }
  .tl-row .cover { position: absolute; inset: 0; border-radius: inherit; }
  .tl-row img { width: 32px; height: 32px; border-radius: 7px; object-fit: cover; }
  .tl-date b { font-size: 16px; }
  .tl-date .away { display: block; margin: 2px 0 0; font-size: 12px; }
  .tl-title { font-weight: 600; min-width: 0; }
  .tl-sub { font-weight: 400; font-size: 12px; color: var(--text-muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .tl-row .star { position: relative; z-index: 1; }
  @media (max-width: 700px) {
    .tl-row { grid-template-columns: 110px 28px minmax(0, 1fr) 24px; }
    .tl-row .conf { display: none; }
  }
  .conf { display: inline-flex; align-items: center; gap: 6px; font-size: 12px; color: var(--text-secondary); font-variant-numeric: tabular-nums; position: relative; z-index: 1; cursor: help; }
  .headline .conf { margin-left: 10px; }
  .tile .conf { margin: 4px 0 2px; }
  .conf .meter { width: 44px; height: 6px; border-radius: 3px; background: var(--accent-track); overflow: hidden; display: inline-block; }
  .tile .conf .meter { background: var(--border); }
  .headline .conf .meter { background: var(--surface-1); }
  .conf .meter > span { display: block; height: 100%; background: var(--accent); border-radius: 0 3px 3px 0; }
  .empty { color: var(--text-muted); padding: 40px 0; text-align: center; }
  @media (max-width: 600px) {
    header, main { padding-left: 16px; padding-right: 16px; }
    .grid { grid-template-columns: 1fr; }
    .row { grid-template-columns: minmax(0, 1fr) 70px 42px 44px; }
    input[type=search] { min-width: 0; flex: 1 1 100%; }
  }
</style>
</head>
<body>
<header>
  <h1>AI Odds Board</h1>
  <div class="controls">
    <input type="search" id="q" placeholder="Search markets (e.g. Claude, IPO, Gemini)">
    <div id="chips"></div>
    <select id="minvol" title="Minimum total volume">
      <option value="0">Any volume</option>
      <option value="10000" selected>$10k+ volume</option>
      <option value="100000">$100k+ volume</option>
      <option value="1000000">$1M+ volume</option>
    </select>
    <span class="status" id="status">Loading…</span>
    <button class="chip" id="theme" title="Switch theme"></button>
  </div>
</header>
<main>
  <div id="vals"></div>
  <h2 id="tiles-title">Best guesses</h2>
  <div class="tiles" id="tiles" data-reorder></div>
  <div id="sections"></div>
</main>

<script>
const API = "https://gamma-api.polymarket.com";
// Polymarket tags that are AI by definition: every active event in them is kept.
const AI_TAGS = ["ai", "openai", "anthropic", "claude", "xai", "chatgpt", "deepseek", "grok", "llm", "ai-regulation",
  "ai-safety", "compute", "artificial-intelligence", "humanoid", "robot", "optimus", "self-driving", "sam-altman"];
// Broad tags that contain some AI events: only events whose title looks AI-related are kept.
const BROAD_TAGS = ["gemini", "google", "nvidia", "tech", "big-tech", "business", "ipos", "privates", "elon-musk"];
// Free-text searches catch AI bets filed under unrelated tags (e.g. an AI executive order under politics).
const SEARCHES = ["AI", "artificial intelligence", "AGI", "superintelligence", "data center", "humanoid robot", "LLM",
  "AI executive order", "AI bill", "AI regulation", "AI chips", "AI model"];
const REFRESH_MS = 60_000;

// First match wins, so order matters.
const SECTIONS = [
  { id: "releases", name: "Model releases", re: /(released|release|launch|debut|drop)/i },
  { id: "ipo", name: "IPOs", re: /\bipo\b|public ticker|list on|exchange will/i },
  { id: "valuation", name: "Valuations & market cap", re: /valuation|market cap|largest (company|private)|private compan|\$\d+ ?[tb]\b|flip/i },
  { id: "bench", name: "Best model & benchmarks", re: /best ai model|arena|humanity|benchmark|score|openrouter|millennium|#1 ai|top ai/i },
  { id: "other", name: "Everything else AI", re: /./ },
];
const AI_WORDS = /\b(ai|a\.i\.|agi|openai|anthropic|claude|fable|opus|sonnet|haiku|gpt|chatgpt|gemini|deepmind|grok|xai|llama|meta ai|deepseek|qwen|mistral|nvidia|data centers?|chatbots?|llms?|models?|robots?|robotics|humanoids?|optimus|self-driving|robotaxis?|waymo|gpus?|[abh]\d00|superintelligence|databricks|perplexity|lambda|anysphere|cursor|cohere|scale ai|cerebras|coreweave|groq|thinking machines|safe superintelligence|ssi|moonshot|kimi|minimax|z\.ai|figure ai)\b/i;

let events = [];
let section = "all";
let valuations = new Map(); // event id → { company, current, history: [[unixSec, value]], source }

// Starred bets live in this browser's localStorage, keyed by Polymarket event id.
const STAR_KEY = "ai-odds-board:starred";
let starred = new Set();
try { starred = new Set(JSON.parse(localStorage.getItem(STAR_KEY) || "[]")); } catch {}
// The Set's insertion order is the user's chosen order on the Starred page.
const saveStars = () => { try { localStorage.setItem(STAR_KEY, JSON.stringify([...starred])); } catch {} };
function toggleStar(id) {
  starred.has(id) ? starred.delete(id) : starred.add(id);
  saveStars();
  render();
}
const starBtn = e => {
  const on = starred.has(e.id);
  return `<button class="star ${on ? "on" : ""}" data-star="${esc(e.id)}" title="${on ? "Unstar" : "Star"} this bet" aria-label="${on ? "Unstar" : "Star"} this bet" aria-pressed="${on}">${on ? "★" : "☆"}</button>`;
};

const fmtUSD = n => n >= 1e9 ? `$${(n/1e9).toFixed(1)}B` : n >= 1e6 ? `$${(n/1e6).toFixed(1)}M` : n >= 1e3 ? `$${(n/1e3).toFixed(0)}k` : `$${Math.round(n)}`;
const pct = p => p >= 0.995 ? ">99%" : p > 0 && p < 0.005 ? "<1%" : `${Math.round(p * 100)}%`;
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));

async function fetchTag(tag) {
  const out = [];
  for (let offset = 0; offset < 1000; offset += 100) {
    const r = await fetch(`${API}/events?tag_slug=${tag}&active=true&closed=false&limit=100&offset=${offset}`);
    if (!r.ok) break;
    const page = await r.json();
    out.push(...page);
    if (page.length < 100) break;
  }
  return out;
}

async function searchEvents(q) {
  const r = await fetch(`${API}/public-search?q=${encodeURIComponent(q)}&limit_per_type=50&events_status=active`);
  return r.ok ? ((await r.json()).events || []) : [];
}

function yesPrice(m) {
  try {
    const outcomes = JSON.parse(m.outcomes), prices = JSON.parse(m.outcomePrices);
    const i = outcomes.findIndex(o => /^yes$/i.test(o));
    return Number(prices[i >= 0 ? i : 0]);
  } catch { return NaN; }
}

// ---------- Consolidating a group of bets into one estimate ----------
const DAY = 86400000;
const MONTHS = ["jan","feb","mar","apr","may","jun","jul","aug","sep","oct","nov","dec"];
const monthIdx = s => MONTHS.indexOf(s.slice(0, 3).toLowerCase());
const NONE_RE = /^(no|not|none)\b/i;
const MULT = { k: 1e3, m: 1e6, b: 1e9, t: 1e12 };

// "October 31" / "Dec 31, 2026". Labels without a year take the year of the market's end date.
function parseDay(s, endMs) {
  const m = s.trim().match(/^([a-z]{3,9})\.?\s+(\d{1,2})(?:,?\s*(\d{4}))?$/i);
  if (!m || monthIdx(m[1]) < 0) return null;
  if (m[3]) return new Date(+m[3], monthIdx(m[1]), +m[2]).getTime();
  const y = new Date(endMs ?? Date.now()).getFullYear();
  const d = new Date(y, monthIdx(m[1]), +m[2]).getTime();
  return endMs && d > endMs + 3 * DAY ? new Date(y - 1, monthIdx(m[1]), +m[2]).getTime() : d;
}

// A date label as a [lo, hi) window: a day, a month ("November 2026") or a range ("Oct 12–Oct 18").
function parseDateBucket(label, endMs) {
  const s = label.trim();
  const mo = s.match(/^([a-z]{3,9})\s+(\d{4})$/i);
  if (mo && monthIdx(mo[1]) >= 0) {
    const y = +mo[2], i = monthIdx(mo[1]);
    return { lo: new Date(y, i, 1).getTime(), hi: new Date(y, i + 1, 1).getTime(), coarse: true };
  }
  const d = parseDay(s, endMs);
  if (d != null) return { lo: d, hi: d + DAY };
  const parts = s.split(/\s*[–—]\s*|\s+-\s+|\s+to\s+/);
  if (parts.length === 2) {
    const a = parseDay(parts[0], endMs), b = parseDay(parts[1], endMs);
    if (a != null && b != null) return { lo: a, hi: b + DAY };
  }
  return null;
}

function numTok(t) {
  const m = t.trim().match(/^\$?\s*(\d+(?:\.\d+)?)\s*([kmbt%])?$/i);
  return m ? { n: +m[1], suf: (m[2] || "").toLowerCase() } : null;
}
const tokVal = t => t.n * (MULT[t.suf] || 1);

// "↑$2.0T", "1480+", "<500B", "$1.25–$1.5T", "60%+", "3" → { x } or { lo, hi }, plus dir and unit.
function parseNumLabel(label) {
  let s = label.replace(/,/g, "").trim(), dir = null;
  if (/^[↑↓]/.test(s)) { dir = s[0] === "↑" ? "up" : "down"; s = s.slice(1).trim(); }
  if (!/\d/.test(s) || /[^\d.$<>+\-–—\skmbt%]/i.test(s)) return null;
  const unit = s.includes("%") ? "pct" : /\$|\d\s*[kmbt]/i.test(s) ? "money" : "num";
  let r = null;
  if (s.startsWith("<")) { const t = numTok(s.slice(1)); r = t && { lo: -Infinity, hi: tokVal(t) }; }
  else if (s.startsWith(">")) { const t = numTok(s.slice(1)); r = t && { lo: tokVal(t), hi: Infinity }; }
  else if (s.endsWith("+")) { const t = numTok(s.slice(0, -1)); r = t && { lo: tokVal(t), hi: Infinity, plus: true }; }
  else {
    const parts = s.split(/\s*[–—-]\s*/);
    if (parts.length === 2) {
      const a = numTok(parts[0]), b = numTok(parts[1]);
      if (a && b) { if (!a.suf && b.suf) a.suf = b.suf; r = { lo: tokVal(a), hi: tokVal(b) }; }
    } else { const t = numTok(s); r = t && { x: tokVal(t) }; }
  }
  return r && { ...r, dir, unit };
}
const thrVal = n => n.x ?? (Number.isFinite(n.lo) ? n.lo : n.hi);

function fmtVal(v, unit) {
  if (unit === "money") {
    const trim = x => String(+x);
    if (v >= 1e12) return `$${trim((v / 1e12).toFixed(2))}T`;
    if (v >= 1e9) return `$${trim((v / 1e9).toFixed(v >= 1e11 ? 0 : 1))}B`;
    if (v >= 1e6) return `$${trim((v / 1e6).toFixed(1))}M`;
    return `$${v.toFixed(2)}`;
  }
  if (unit === "count") {
    for (const [d, suf] of [[1e12, "T"], [1e9, "B"], [1e6, "M"], [1e3, "K"]]) if (v >= d) return `${trim1(v / d)}${suf}`;
  }
  if (unit === "pct") return `${trim1(v)}%`;
  return v >= 100 ? Math.round(v).toLocaleString() : trim1(v);
}
const trim1 = v => String(+v.toFixed(1));
function fmtDate(ms, coarse) {
  const d = new Date(ms), sameYear = d.getFullYear() === new Date().getFullYear();
  return d.toLocaleDateString(undefined, coarse
    ? { month: "short", year: "numeric" }
    : { month: "short", day: "numeric", ...(sameYear ? {} : { year: "numeric" }) });
}

// Where a CDF (points sorted by x, y non-decreasing) reaches probability q.
// Numbers: linear between points. Dates (hazard): a steady daily chance between points, i.e.
// log(1 − y) is linear, so a long gap isn't treated as an ever-rising daily chance.
function crossing(pts, q, hazard) {
  if (pts[0].y >= q) return { x: pts[0].x, bound: "lo" };
  for (let i = 1; i < pts.length; i++) {
    if (pts[i].y >= q) {
      const a = pts[i - 1], b = pts[i];
      const frac = hazard && b.y < 1
        ? Math.log((1 - a.y) / (1 - q)) / Math.log((1 - a.y) / (1 - b.y))
        : (q - a.y) / (b.y - a.y || 1);
      return { x: a.x + frac * (b.x - a.x) };
    }
  }
  return { x: pts.at(-1).x, bound: "hi" };
}
// Force a CDF to be non-decreasing; pts.corr records how much probability had to be fixed.
const monotoneUp = pts => {
  let corr = 0;
  for (let i = 1; i < pts.length; i++) {
    if (pts[i].y < pts[i - 1].y) { corr += pts[i - 1].y - pts[i].y; pts[i].y = pts[i - 1].y; }
  }
  pts.corr = corr;
  return pts;
};

// Inverse of the standard normal CDF (Acklam's approximation).
function invNorm(p) {
  const a = [-39.69683028665376, 220.9460984245205, -275.9285104469687, 138.3577518672690, -30.66479806614716, 2.506628277459239];
  const b = [-54.47609879822406, 161.5858368580409, -155.6989798598866, 66.80131188771972, -13.28068155288572];
  const c = [-0.007784894002430293, -0.3223964580411365, -2.400758277161838, -2.549732539343734, 4.374664141464968, 2.938163982698783];
  const d = [0.007784695709041462, 0.3224671290700398, 2.445134137142996, 3.754408661907416];
  const tail = q => (((((c[0] * q + c[1]) * q + c[2]) * q + c[3]) * q + c[4]) * q + c[5]) / ((((d[0] * q + d[1]) * q + d[2]) * q + d[3]) * q + 1);
  if (p < 0.02425) return tail(Math.sqrt(-2 * Math.log(p)));
  if (p > 1 - 0.02425) return -tail(Math.sqrt(-2 * Math.log(1 - p)));
  const q = p - 0.5, r = q * q;
  return (((((a[0] * r + a[1]) * r + a[2]) * r + a[3]) * r + a[4]) * r + a[5]) * q / (((((b[0] * r + b[1]) * r + b[2]) * r + b[3]) * r + b[4]) * r + 1);
}

// When the listed bets never reach probability q, extend the curve past them.
// Dates: assume a constant hazard (the pace of "it happens" implied from t0 to the last
// listed date) and solve for when the chance reaches q.
// Numbers: fit a normal curve through all the points (log scale for money) and read q off it.
const MAX_EXTRAP = 10 * 365 * DAY;
function quantile(pts, q, { t0, log } = {}) {
  const c = crossing(pts, q, t0 != null);
  if (!c.bound) return c;
  if (t0 != null) {
    const last = pts.at(-1);
    if (c.bound !== "hi" || last.y <= 0 || last.y >= 1 || last.x <= t0) return c;
    const rate = -Math.log(1 - last.y) / (last.x - t0);
    const x = t0 - Math.log(1 - q) / rate;
    return x - t0 > MAX_EXTRAP ? c
      : { x, extrap: true, reached: Math.min(1, last.y / q), dist: (x - last.x) / (last.x - t0) };
  }
  const T = log ? Math.log : v => v, inv = log ? Math.exp : v => v;
  const use = pts.filter(p => p.y > 0.01 && p.y < 0.99 && (!log || p.x > 0));
  if (use.length < 2) return c;
  // Least squares of z = invNorm(y) on t = T(x): z = alpha + beta·t.
  const ts = use.map(p => T(p.x)), zs = use.map(p => invNorm(p.y));
  const mt = ts.reduce((s, v) => s + v, 0) / ts.length, mz = zs.reduce((s, v) => s + v, 0) / zs.length;
  const beta = ts.reduce((s, t, i) => s + (t - mt) * (zs[i] - mz), 0) / ts.reduce((s, t) => s + (t - mt) ** 2, 0);
  if (!(beta > 0)) return c;
  const tq = mt + (invNorm(q) - mz) / beta, x = inv(tq);
  const t1 = T(pts[0].x), t2 = T(pts.at(-1).x), span = Math.max(t2 - t1, 1e-9);
  const ok = c.bound === "hi" ? x > pts.at(-1).x && tq - t2 <= 2 * span
    : x < pts[0].x && x >= 0 && t1 - tq <= 2 * span;
  if (!ok) return c;
  const edge = c.bound === "hi" ? pts.at(-1) : pts[0];
  const reached = c.bound === "hi" ? edge.y / q : (1 - edge.y) / (1 - q);
  return { x, extrap: true, reached: Math.min(1, reached), dist: Math.abs(tq - T(edge.x)) / span };
}

function fmtQ(c, f, isDate) {
  if (c.bound === "hi") return isDate ? "later" : `> ${f(c.x)}`;
  if (c.bound === "lo") return isDate ? `by ${f(c.x)}` : `< ${f(c.x)}`;
  return c.extrap ? `~${f(c.x)}` : f(c.x);
}
function rangeText(pts, f, opts = {}) {
  const a = quantile(pts, 0.25, opts), b = quantile(pts, 0.75, opts);
  if (a.bound && a.bound === b.bound) return "";
  return ` · 50% range: ${fmtQ(a, f, opts.t0 != null)} – ${fmtQ(b, f, opts.t0 != null)}`;
}
// ---------- Confidence in a best guess ----------
// Score in (0, 1): coverage × √data × √liquidity × √precision × consistency.
//   coverage     1 when the 50% point sits inside the listed bets. Extrapolated:
//                √(share of the way to 50% the prices reach × 1/(1 + extrapolated distance / data span)).
//                Not reached at all: 0.1. Further reduced when most of the money says "it won't happen".
//   data         n/(n+1) for n listed price points (2 → 67%, 4 → 80%, 9 → 90%).
//   liquidity    0.2·log10(volume) − 0.3 within [0.1, 1]: $10k → 50%, $100k → 70%, $1M → 90%.
//   precision    1/(1 + width of the 50% range / scale), scale = time until the guess (at least
//                30 days) for dates, half the value for numbers. Open-ended range: 33%.
//   consistency  1 − probability we had to correct because prices contradicted each other (≥ 50%).
function coverageOf(med) {
  if (med.bound) return 0.1;
  return med.extrap ? Math.sqrt(med.reached / (1 + med.dist)) : 1;
}
function precisionOf(pts, opts, medX, scale) {
  const a = quantile(pts, 0.25, opts), b = quantile(pts, 0.75, opts);
  if (a.bound || b.bound || !(scale > 0)) return 1 / 3;
  return 1 / (1 + (b.x - a.x) / scale);
}
const consistencyOf = pts => 1 - Math.min(0.5, pts.corr || 0);
function confidence({ coverage = 1, n, precision = 0.5, consistency = 1 }, vol) {
  const liquidity = Math.min(1, Math.max(0.1, 0.2 * Math.log10(Math.max(vol, 1)) - 0.3));
  const data = n / (n + 1);
  const score = coverage * Math.sqrt(data) * Math.sqrt(liquidity) * Math.sqrt(precision) * consistency;
  return { score: Math.min(0.99, Math.max(0.01, score)), coverage, data, liquidity, precision, consistency, n, vol };
}
function confTip(c) {
  const p = v => `${Math.round(v * 100)}%`;
  return [
    `Confidence ${p(c.score)} = coverage × √data × √volume × √tightness × consistency`,
    `Coverage ${p(c.coverage)}: ${c.coverage >= 1 ? "the 50% point is inside the listed bets" : "part of the estimate is extrapolated"}`,
    `Data ${p(c.data)}: ${c.n} price points`,
    `Volume ${p(c.liquidity)}: ${fmtUSD(c.vol)} traded`,
    `Range tightness ${p(c.precision)}`,
    `Price consistency ${p(c.consistency)}`,
  ].join("\n");
}
function confBadge(c) {
  if (!c) return "";
  const v = Math.round(c.score * 100);
  return `<span class="conf" title="${esc(confTip(c))}"><span class="meter"><span style="width:${v}%"></span></span>${v}% confidence</span>`;
}

// "in 4 days" for a date estimate, counted in calendar days.
function awayText(h) {
  if (h?.when == null) return "";
  const day = ms => { const d = new Date(ms); return new Date(d.getFullYear(), d.getMonth(), d.getDate()).getTime(); };
  const n = Math.round((day(h.when) - day(Date.now())) / DAY);
  // Over a month → months, over a year → years, to one decimal ("in 1.4 months", "in 2 years").
  const span = d => {
    const unit = (v, w) => `${trim1(v)} ${w}${trim1(v) === "1" ? "" : "s"}`;
    return d > 365 ? unit(d / 365.25, "year") : d > 30 ? unit(d / 30.44, "month") : unit(d, "day");
  };
  const t = n === 0 ? "today" : n === 1 ? "tomorrow" : n < 0 ? `${span(-n)} ago` : `in ${h.after ? "over " : ""}${span(n)}`;
  return `<span class="away">${t}</span>`;
}

const bigNum = (c, f) => c.bound === "lo" ? `< ${f(c.x)}` : c.bound === "hi" ? `> ${f(c.x)}` : `~${f(c.x)}`;

// Headline + explanation for a date estimate, including extrapolated ones.
function dateResult(pts, f, t0, lastP, lastX, n) {
  const med = quantile(pts, 0.5, { t0 });
  const conf = {
    coverage: coverageOf(med), n, consistency: consistencyOf(pts),
    precision: precisionOf(pts, { t0 }, med.x, Math.max(Math.abs(med.x - Date.now()), 30 * DAY)),
  };
  if (med.bound === "hi") return { big: `After ${f(med.x)}`, sub: `only ${pct(lastP)} chance by then`, conf, when: med.x, after: true };
  const note = med.extrap ? `extrapolated: ${pct(lastP)} by ${f(lastX)}, same pace after` : "best-guess date (50/50)";
  return { big: med.extrap ? `~${f(med.x)}` : f(med.x), sub: `${note}${rangeText(pts, f, { t0 })}`, conf, when: med.x };
}

// "Released by Oct 31?" ladders: each market is P(happens by that date), i.e. a CDF over time.
function dateLadder(real) {
  const now = Date.now();
  const pts = monotoneUp(real.map(m => ({ x: m.date.hi - 1, y: m.p })).sort((a, b) => a.x - b.x));
  if (pts[0].x > now) pts.unshift({ x: now, y: 0 });
  const f = x => fmtDate(x);
  return dateResult(pts, f, Math.min(now, pts[0].x), pts.at(-1).y, pts.at(-1).x, real.length);
}

// "Released on…?" / "Which month?" buckets: mutually exclusive windows, plus maybe a "No … by X" tail.
function dateBuckets(real, none) {
  const total = [...real, ...none].reduce((s, m) => s + m.p, 0);
  if (total <= 0) return null;
  real.sort((a, b) => a.date.lo - b.date.lo);
  const coarse = real.some(m => m.date.coarse), f = x => fmtDate(x - 1, coarse);
  const pts = [{ x: real[0].date.lo, y: 0 }];
  let cum = 0;
  for (const m of real) { cum += m.p / total; pts.push({ x: m.date.hi, y: cum }); }
  const res = dateResult(pts, f, Math.min(Date.now(), real[0].date.lo), cum, pts.at(-1).x, real.length + none.length);
  return res;
}

// "Valuation hit ↑$2T?", "Arena debut 1480+?", "score 60%+?": each market is P(value ≥ x).
function numThresholds(real, title) {
  const unit = real[0].num.unit, f = v => fmtVal(v, unit);
  const up = real.filter(m => m.num.dir !== "down"), down = real.filter(m => m.num.dir === "down");
  const peak = /\b(hit|reach|highest)\b/i.test(title);
  let pts, label;
  if (up.length >= 2) {
    // Survival S(x) = P(value ≥ x) → CDF 1 − S, made monotone.
    pts = monotoneUp(up.map(m => ({ x: thrVal(m.num), y: 1 - m.p })).sort((a, b) => a.x - b.x));
    label = peak ? "implied peak" : "implied value";
  } else if (down.length >= 2) {
    // P(drops to ≤ x) is already a CDF of the low point.
    pts = monotoneUp(down.map(m => ({ x: thrVal(m.num), y: m.p })).sort((a, b) => a.x - b.x));
    label = "implied low";
  } else return null;
  const opts = { log: unit === "money" };
  const med = quantile(pts, 0.5, opts);
  const note = med.extrap ? `${label}, extrapolated past the listed levels` : `${label} (median)`;
  const conf = {
    coverage: coverageOf(med), n: pts.length, consistency: consistencyOf(pts),
    precision: precisionOf(pts, opts, med.x, Math.abs(med.x) / 2),
  };
  return { big: bigNum(med, f), sub: `${note}${rangeText(pts, f, opts)}`, conf };
}

// "<500B | 500–750B | … | 1.5T+ | No IPO" or "0 | 1 | 2 | 3": mutually exclusive numeric buckets.
function numBuckets(real, none) {
  const unit = real[0].num.unit, f = v => fmtVal(v, unit);
  const tot = real.reduce((s, m) => s + m.p, 0), noneP = none.reduce((s, m) => s + m.p, 0);
  if (tot <= 0) return null;
  const noneShare = noneP / (tot + noneP);
  const cond = noneShare > 0.02 ? ` · assumes it happens (${pct(noneShare)} it doesn't)` : "";
  const n = real.length + none.length, happens = Math.sqrt(1 - noneShare);
  if (real.every(m => m.num.x != null)) {
    const mean = real.reduce((s, m) => s + m.num.x * m.p, 0) / tot;
    const sd = Math.sqrt(real.reduce((s, m) => s + m.p / tot * (m.num.x - mean) ** 2, 0));
    const conf = { coverage: happens, n, precision: 1 / (1 + 1.35 * sd / Math.max(mean / 2, 0.5)) };
    return { big: `≈${f(mean)}`, sub: `expected value${cond}`, conf };
  }
  const b = real.map(m => ({ lo: m.num.lo ?? m.num.x, hi: m.num.hi ?? m.num.x, p: m.p / tot }))
    .sort((a, c) => (Number.isFinite(a.lo) ? a.lo : a.hi) - (Number.isFinite(c.lo) ? c.lo : c.hi));
  for (let i = 0; i < b.length - 1; i++) if (b[i].hi < b[i + 1].lo) b[i].hi = b[i + 1].lo; // "12-15 | 16-19"
  const width = i => (b[i] && Number.isFinite(b[i].lo) && Number.isFinite(b[i].hi)) ? b[i].hi - b[i].lo : null;
  if (!Number.isFinite(b[0].lo)) b[0].lo = Math.max(0, b[0].hi - (width(1) ?? b[0].hi * 0.5));
  const L = b.length - 1;
  if (!Number.isFinite(b[L].hi)) b[L].hi = b[L].lo + (width(L - 1) ?? b[L].lo * 0.5);
  const pts = [{ x: b[0].lo, y: 0 }];
  let cum = 0;
  for (const k of b) { cum += k.p; pts.push({ x: k.hi, y: cum }); }
  const med = quantile(pts, 0.5);
  // A median inside an open-ended bucket ("<500B", "1.5T+") leans on our guessed bucket width.
  const inOpen = (real.some(m => m.num.lo === -Infinity) && med.x < b[0].hi)
    || (real.some(m => m.num.hi === Infinity) && med.x > b[L].lo);
  const conf = {
    coverage: happens * (inOpen ? 0.6 : 1), n, consistency: 1,
    precision: precisionOf(pts, {}, med.x, Math.abs(med.x) / 2),
  };
  return { big: bigNum(med, f), sub: `implied median${cond}${rangeText(pts, f)}`, conf };
}

function estimate(markets, negRisk, title) {
  const r = estimateRaw(markets, negRisk, title);
  if (r?.conf) r.conf = confidence(r.conf, markets.reduce((s, m) => s + (m.vol || 0), 0));
  return r;
}

function estimateRaw(markets, negRisk, title) {
  if (markets.length < 2) return null;
  const real = markets.filter(m => !NONE_RE.test(m.label)), none = markets.filter(m => NONE_RE.test(m.label));
  if (real.length < 2) return null;
  const dates = real.map(m => parseDateBucket(m.label, m.end));
  if (dates.every(Boolean)) {
    real.forEach((m, i) => { m.date = dates[i]; m.key = dates[i].lo; });
    return negRisk ? dateBuckets(real, none) : dateLadder(real);
  }
  const nums = real.map(m => parseNumLabel(m.label));
  if (nums.every(Boolean)) {
    const moneyish = real.some(m => m.label.includes("$")) || /valuation|market cap|price|raise|revenue|\$/i.test(title);
    if (!moneyish) nums.forEach(n => { if (n.unit === "money") n.unit = "count"; });
    real.forEach((m, i) => { m.num = nums[i]; m.key = thrVal(nums[i]); });
    return negRisk ? numBuckets(real, none) : numThresholds(real, title);
  }
  if (!negRisk && markets.length >= 3) {
    const n = markets.reduce((s, m) => s + m.p, 0);
    return { big: `≈${trim1(n)} of ${markets.length}`, sub: "expected number that happen" };
  }
  return null;
}

function prepare(e) {
  const markets = (e.markets || [])
    .filter(m => !m.closed && m.active !== false)
    .map(m => ({
      label: m.groupItemTitle || m.question,
      question: m.question,
      p: yesPrice(m),
      chg: Number(m.oneDayPriceChange) || 0,
      vol: Number(m.volume) || 0,
      end: m.endDate ? Date.parse(m.endDate) : null,
    }))
    .filter(m => Number.isFinite(m.p));
  if (!markets.length) return null;

  const negRisk = !!(e.negRisk || e.markets?.[0]?.negRisk);
  const est = estimate(markets, negRisk, e.title);
  // Ordered bets (dates, numbers) read best in order with any "No … by" bucket last; the rest by odds.
  if (markets.some(m => m.key != null)) {
    markets.sort((a, b) => (a.key ?? Infinity) - (b.key ?? Infinity));
  } else {
    markets.sort((a, b) => b.p - a.p);
  }

  let headline;
  if (est) headline = { ...est, kind: "Best guess" };
  else if (markets.length === 1) headline = { big: pct(markets[0].p), sub: "chance of Yes", kind: "Odds" };
  else headline = { big: markets[0].label, sub: `leading at ${pct(markets[0].p)}`, kind: "Leader" };

  const text = `${e.title} ${e.slug}`;
  return {
    id: e.id, title: e.title, slug: e.slug, image: e.icon || e.image,
    vol: Number(e.volume) || 0, vol24: Number(e.volume24hr) || 0,
    end: e.endDate, markets, sec: SECTIONS.find(s => s.re.test(text)).id, headline,
  };
}

async function load() {
  const status = document.getElementById("status");
  try {
    const [aiLists, broadLists, searchLists] = await Promise.all([
      Promise.all(AI_TAGS.map(t => fetchTag(t).catch(() => []))),
      Promise.all(BROAD_TAGS.map(t => fetchTag(t).catch(() => []))),
      Promise.all(SEARCHES.map(q => searchEvents(q).catch(() => []))),
    ]);
    const seen = new Map();
    const add = e => { if (!seen.has(e.id)) { const p = prepare(e); if (p) seen.set(e.id, p); } };
    aiLists.flat().forEach(add);
    // Broad tags and fuzzy search results: keep only events whose title looks AI-related.
    [...broadLists.flat(), ...searchLists.flat()]
      .filter(e => !e.closed && e.active !== false && AI_WORDS.test(e.title))
      .forEach(add);
    events = [...seen.values()];
    status.textContent = `${events.length} markets · updated ${new Date().toLocaleTimeString()}`;
    render();
    loadValuations();
  } catch (err) {
    status.textContent = `Couldn't reach Polymarket (${err.message}). Retrying…`;
  }
}

// Current private valuations come from our local server (server.py), which reads them off
// Polymarket's "valuation hit" event pages. Without that server this quietly does nothing.
async function loadValuations() {
  const targets = events.filter(e => /valuation/i.test(e.title) && /\bhit\b/i.test(e.title));
  await Promise.all(targets.map(async e => {
    try {
      const r = await fetch(`/api/valuation?slug=${encodeURIComponent(e.slug)}`);
      if (!r.ok) return;
      const v = await r.json();
      if (!v || !v.current) return;
      valuations.set(e.id, v);
      // The peak can't be below today's value, so add that as a certain "hit" before estimating.
      const anchor = { label: `↑$${(v.current / 1e9).toFixed(3)}B`, p: 1, chg: 0, vol: 0 };
      const est = estimate([...e.markets.map(m => ({ ...m })), anchor], false, e.title);
      if (est) e.headline = { ...est, kind: "Best guess" };
    } catch {}
  }));
  if (valuations.size) render();
}

function valChange(v, days) {
  const h = v.history;
  if (!h?.length) return null;
  const cutoff = Date.now() / 1000 - days * 86400;
  const past = days >= 365 ? h[0] : [...h].reverse().find(p => p[0] <= cutoff);
  return past && past[1] > 0 ? v.current / past[1] - 1 : null;
}
function chgSpan(c, label) {
  if (c == null) return "";
  const pctTxt = Math.abs(c) >= 0.1 ? Math.round(Math.abs(c) * 100).toLocaleString() : (Math.abs(c) * 100).toFixed(1);
  return `<span class="${c >= 0 ? "up" : "down"}">${c >= 0 ? "▲" : "▼"}${pctTxt}% ${label}</span>`;
}
function sparkline(v) {
  const h = v.history;
  if (!h || h.length < 2) return "";
  const ys = h.map(p => p[1]), lo = Math.min(...ys), hi = Math.max(...ys), t0 = h[0][0], t1 = h.at(-1)[0];
  const pts = h.map(([t, y]) => `${((t - t0) / (t1 - t0 || 1) * 100).toFixed(2)},${(30 - (y - lo) / (hi - lo || 1) * 28 - 1).toFixed(2)}`).join(" ");
  const tip = `${v.company}: ${fmtVal(h[0][1], "money")} on ${new Date(t0 * 1000).toLocaleDateString()} → ${fmtVal(v.current, "money")} now`;
  return `<svg class="spark" viewBox="0 0 100 30" preserveAspectRatio="none" role="img" aria-label="${esc(tip)}"><title>${esc(tip)}</title><polyline points="${pts}"/></svg>`;
}
function renderValuations(q) {
  const el = document.getElementById("vals");
  const byCompany = new Map();
  for (const e of [...events].sort((a, b) => b.vol - a.vol)) {
    const v = valuations.get(e.id);
    if (v && !byCompany.has(v.company)) byCompany.set(v.company, { v, e });
  }
  const show = (section === "all" || section === "valuation") && byCompany.size;
  const items = [...byCompany.values()]
    .filter(({ v, e }) => !q || `${v.company} ${e.title}`.toLowerCase().includes(q))
    .sort((a, b) => b.v.current - a.v.current);
  el.innerHTML = show && items.length ? `<h2>Current private valuations</h2><div class="tiles">${items.map(({ v, e }) => {
    const by = (e.title.match(/\bby ([^?]+)\?/i) || [])[1];
    return `<div class="tile val-tile" title="${esc(`${v.company} valuation (Nasdaq Private Market)`)}">
      <a class="cover" href="https://polymarket.com/event/${e.slug}" target="_blank" rel="noopener" aria-label="${esc(e.title)}"></a>
      <div class="tile-head">${e.image ? `<img src="${esc(e.image)}" alt="" loading="lazy" draggable="false">` : ""}<div class="co">${esc(v.company)}</div></div>
      <div class="big">${fmtVal(v.current, "money")}</div>
      <div class="chgs">${chgSpan(valChange(v, 30), "30d")}${chgSpan(valChange(v, 365), "1y")}</div>
      ${sparkline(v)}
      ${e.headline.kind === "Best guess" ? `<div class="sub">Market's best guess${by ? ` by ${esc(by)}` : ""}: <b>${esc(e.headline.big)}</b></div>` : ""}
    </div>`;
  }).join("")}</div>` : "";
}

function renderChips() {
  const el = document.getElementById("chips");
  const nStar = events.filter(e => starred.has(e.id)).length;
  const opts = [
    { id: "all", name: "All" }, { id: "starred", name: `★ Starred${nStar ? ` (${nStar})` : ""}` },
    { id: "timeline", name: "Timeline" }, { id: "starred-timeline", name: "★ Timeline" }, ...SECTIONS,
  ];
  el.innerHTML = opts.map(s => `<button class="chip ${s.id === section ? "on" : ""}" data-id="${s.id}">${esc(s.name)}</button>`).join(" ");
  el.querySelectorAll(".chip").forEach(b => b.onclick = () => { section = b.dataset.id; render(); });
}

function row(m) {
  const c = Math.round(m.chg * 100);
  const cls = c > 0 ? "up" : c < 0 ? "down" : "";
  const chg = c === 0 ? "–" : `${c > 0 ? "▲" : "▼"}${Math.abs(c)}`;
  const tip = `${m.question}\nYes: ${pct(m.p)} · 24h: ${c >= 0 ? "+" : ""}${c} pts · volume ${fmtUSD(m.vol)}`;
  return `<div class="row" title="${esc(tip)}">
    <span class="name">${esc(m.label)}</span>
    <span class="bar"><span style="width:${Math.max(0, Math.min(100, m.p * 100))}%"></span></span>
    <span class="pct">${pct(m.p)}</span>
    <span class="chg ${cls}">${chg}</span>
  </div>`;
}

function card(e) {
  const SHOW = 6;
  const url = `https://polymarket.com/event/${e.slug}`;
  const rows = e.markets.map(row);
  const drag = section === "starred";
  return `<article class="card" data-id="${esc(e.id)}"${drag ? ` draggable="true"` : ""}>
    <div class="card-head">
      ${e.image ? `<img src="${esc(e.image)}" alt="" loading="lazy" draggable="false">` : ""}
      <div>
        <a href="${url}" target="_blank" rel="noopener" draggable="false">${esc(e.title)}</a>
        <div class="meta">${fmtUSD(e.vol)} vol · ${fmtUSD(e.vol24)} 24h${e.end ? ` · ends ${new Date(e.end).toLocaleDateString()}` : ""}</div>
      </div>
      ${starBtn(e)}
    </div>
    ${valuations.has(e.id) ? (v => `<div class="now">Now: <b>${fmtVal(v.current, "money")}</b> <span class="chgs">${chgSpan(valChange(v, 30), "30d")}</span>${sparkline(v)}</div>`)(valuations.get(e.id)) : ""}
    ${e.markets.length > 1 ? `<div class="headline ${e.headline.kind === "Best guess" ? "est" : ""}"><span class="k">${e.headline.kind}</span> <b>${esc(e.headline.big)}</b>${awayText(e.headline)}${confBadge(e.headline.conf)}<div class="hsub">${esc(e.headline.sub)}</div></div>` : ""}
    <div class="rows">${rows.slice(0, SHOW).join("")}<div class="hidden" hidden>${rows.slice(SHOW).join("")}</div></div>
    ${rows.length > SHOW ? `<button class="more">Show ${rows.length - SHOW} more</button>` : ""}
  </article>`;
}

let dragId = null, renderPending = false;
// Timeline: every bet whose best guess is a date, soonest first, grouped by month.
function renderTimeline(q, minVol, onlyStarred) {
  const items = events
    .filter(e => e.headline.when != null)
    .filter(e => onlyStarred ? starred.has(e.id) : e.vol >= minVol)
    .filter(e => !q || `${e.title} ${e.markets.map(m => m.label).join(" ")}`.toLowerCase().includes(q))
    .sort((a, b) => a.headline.when - b.headline.when);
  const el = document.getElementById("sections");
  if (!items.length) {
    el.innerHTML = `<div class="empty">${onlyStarred ? "None of your starred bets has a predicted date yet. Star date bets (releases, IPOs…) to see them here." : "No dated bets match."}</div>`;
    return;
  }
  let month = null, html = `<h2>${onlyStarred ? "Starred timeline" : "Timeline"} <span class="count">${items.length}</span><span class="hint">soonest predicted first</span></h2><div class="timeline">`;
  for (const e of items) {
    const h = e.headline, m = new Date(h.when).toLocaleDateString(undefined, { month: "long", year: "numeric" });
    if (m !== month) { month = m; html += `<div class="tl-month">${m}</div>`; }
    html += `<div class="tl-row" title="${esc(e.title)}">
      <a class="cover" href="https://polymarket.com/event/${e.slug}" target="_blank" rel="noopener" aria-label="${esc(e.title)}"></a>
      <div class="tl-date"><b>${esc(h.big)}</b>${awayText(h)}</div>
      ${e.image ? `<img src="${esc(e.image)}" alt="" loading="lazy">` : `<span></span>`}
      <div class="tl-title">${esc(e.title)}<div class="tl-sub">${esc(h.sub)}</div></div>
      ${confBadge(h.conf)}
      ${starBtn(e)}
    </div>`;
  }
  el.innerHTML = html + `</div>`;
}

function render() {
  // A background refresh mid-drag would yank the tiles out from under the pointer.
  if (dragId) { renderPending = true; return; }
  renderChips();
  const q = document.getElementById("q").value.trim().toLowerCase();
  renderValuations(q);
  const minVol = Number(document.getElementById("minvol").value);
  const timeline = section === "timeline" || section === "starred-timeline";
  document.getElementById("tiles-title").hidden = document.getElementById("tiles").hidden = timeline;
  if (timeline) return renderTimeline(q, minVol, section === "starred-timeline");
  const starView = section === "starred";
  const list = events
    .filter(e => starView ? starred.has(e.id) : e.vol >= minVol)
    .filter(e => !q || `${e.title} ${e.markets.map(m => m.label).join(" ")}`.toLowerCase().includes(q))
    // A search looks across every category, not just the selected one.
    .filter(e => section === "all" || starView || q || e.sec === section)
    .sort((a, b) => b.vol - a.vol);
  if (starView) {
    const order = [...starred];
    list.sort((a, b) => order.indexOf(a.id) - order.indexOf(b.id));
  }

  // Headline tiles: the top few by 24h volume, favouring release dates and IPOs.
  const weight = e => (e.vol24 + e.vol / 30) * (e.headline.kind === "Best guess" ? 4 : 1) * (e.sec === "releases" || e.sec === "ipo" || e.sec === "valuation" ? 2 : 1);
  const tiles = starView ? list : [...list].sort((a, b) => weight(b) - weight(a)).slice(0, 12);
  document.getElementById("tiles-title").innerHTML = starView
    ? `Starred bets${tiles.length > 1 ? `<span class="hint">drag to reorder</span>` : ""}` : "Best guesses";
  const empty = starView ? "No starred bets yet. Click ☆ on any bet to pin it here." : "No markets match.";
  document.getElementById("tiles").innerHTML = tiles.length ? tiles.map(e => `
    <div class="tile" title="${esc(e.title)}" data-id="${esc(e.id)}"${starView ? ` draggable="true"` : ""}>
      <a class="cover" href="https://polymarket.com/event/${e.slug}" target="_blank" rel="noopener" aria-label="${esc(e.title)}" draggable="false"></a>
      ${starBtn(e)}
      <div class="tile-head">${e.image ? `<img src="${esc(e.image)}" alt="" loading="lazy" draggable="false">` : ""}<div class="label">${esc(e.title)}</div></div>
      <div class="kind ${e.headline.kind === "Best guess" ? "est" : ""}">${e.headline.kind}</div>
      <div class="big">${esc(e.headline.big)}${awayText(e.headline)}</div>
      ${confBadge(e.headline.conf)}
      <div class="sub">${esc(e.headline.sub)}</div>
    </div>`).join("") : `<div class="empty">${empty}</div>`;

  document.getElementById("sections").innerHTML = SECTIONS.map(s => {
    const items = list.filter(e => e.sec === s.id);
    if (!items.length) return "";
    const hint = starView && items.length > 1 ? `<span class="hint">drag to reorder</span>` : "";
    return `<h2>${esc(s.name)} <span class="count">${items.length}</span>${hint}</h2><div class="grid"${starView ? " data-reorder" : ""}>${items.map(card).join("")}</div>`;
  }).join("");

  document.querySelectorAll(".more").forEach(b => b.onclick = () => {
    const hidden = b.previousElementSibling.querySelector(".hidden");
    hidden.hidden = !hidden.hidden;
    b.textContent = hidden.hidden ? b.textContent.replace("Hide", "Show") : b.textContent.replace("Show", "Hide");
  });
}

// Theme: Light ⇄ Dark, remembered in this browser. First visit follows the OS setting.
const THEME_KEY = "ai-odds-board:theme";
let theme = null;
try { theme = localStorage.getItem(THEME_KEY); } catch {}
if (theme !== "light" && theme !== "dark") theme = matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
function applyTheme() {
  document.documentElement.dataset.theme = theme;
  document.getElementById("theme").textContent = theme === "dark" ? "☾ Dark" : "☀ Light";
}
document.getElementById("theme").onclick = () => {
  theme = theme === "dark" ? "light" : "dark";
  try { localStorage.setItem(THEME_KEY, theme); } catch {}
  applyTheme();
};
applyTheme();

// Drag-and-drop reordering on the Starred page, for the tiles and for the cards in each
// section. Items move live while dragging; on drop the container's new order is written
// back into the star order (other starred bets keep their positions).
const mainEl = document.querySelector("main");
let dragBox = null;
mainEl.addEventListener("dragstart", ev => {
  const item = ev.target.closest?.("[data-reorder] > [draggable=true]");
  if (!item) return;
  dragId = item.dataset.id;
  dragBox = item.parentNode;
  item.classList.add("dragging");
  ev.dataTransfer.effectAllowed = "move";
  ev.dataTransfer.setData("text/plain", dragId);
});
mainEl.addEventListener("dragover", ev => {
  if (!dragId) return;
  const over = ev.target.closest("[data-reorder] > [data-id]");
  if (!over || over.parentNode !== dragBox) return;
  ev.preventDefault();
  const dragged = dragBox.querySelector(".dragging");
  if (!dragged || over === dragged) return;
  const r = over.getBoundingClientRect();
  dragBox.insertBefore(dragged, ev.clientX > r.left + r.width / 2 ? over.nextSibling : over);
});
mainEl.addEventListener("drop", ev => { if (dragId) ev.preventDefault(); });
mainEl.addEventListener("dragend", () => {
  if (!dragId) return;
  const shown = [...dragBox.children].map(el => el.dataset.id).filter(Boolean);
  const inBox = new Set(shown);
  let k = 0;
  starred = new Set([...starred].map(id => inBox.has(id) ? shown[k++] : id));
  saveStars();
  dragId = dragBox = null;
  renderPending = false;
  render();
});

document.addEventListener("click", ev => {
  const b = ev.target.closest("[data-star]");
  if (b) { ev.preventDefault(); toggleStar(b.dataset.star); }
});
document.getElementById("q").addEventListener("input", render);
document.getElementById("minvol").addEventListener("change", render);
load();
setInterval(load, REFRESH_MS);
</script>
</body>
